# Leibniz prover — full fine-tune (more capacity; needs more VRAM)
# Usage: python leibniz/training/train.py --config leibniz/training/configs/finetune_full.yaml

base_model: Qwen/Qwen2.5-Math-1.5B-Instruct
tokenizer: null
torch_dtype: bf16

method: full

data:
  corpus: leibniz/training/data/bundled_sample.jsonl
  val_split: 0.1

max_seq_length: 1024
training:
  output_dir: leibniz/training/checkpoints/full
  epochs: 2
  batch_size: 2
  grad_accum: 8
  lr: 1.0e-5
  warmup_ratio: 0.03

generation:
  max_new_tokens: 256
  temperature: 0.7

eval:
  k: 4
