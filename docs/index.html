<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Leibniz — Proof Checker</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Playfair+Display:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
<style>
  :root {
    --ink: #000000;
    --slate: #1f2937;
    --muted: #6b7280;
    --faint: #f3f4f6;
    --line: #e5e7eb;
    --paper: #ffffff;
    --mono: 'SF Mono', 'Consolas', 'Roboto Mono', monospace;
    --radius: 3px;
    --shadow: 0 1px 2px rgba(0,0,0,.05);
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Inter', sans-serif; color: var(--ink); background: var(--paper);
    line-height: 1.6; min-height: 100vh;
  }

  header {
    text-align: center; padding: 3rem 1rem 2rem;
    background: var(--paper); border-bottom: 1px solid var(--line);
  }
  header h1 { font-size: 2rem; font-weight: 800; letter-spacing: -0.5px; margin-bottom: .2rem; }
  header p { color: var(--muted); max-width: 580px; margin: 0 auto; font-size: .92rem; }
  header .accent { font-family: 'Playfair Display', serif; font-style: italic; }
  header .label {
    display: inline-block; margin-top: .8rem; padding: .15em .7em;
    border: 1px solid var(--ink); font-size: .68rem; font-weight: 600;
    text-transform: uppercase; letter-spacing: 1.5px; border-radius: var(--radius);
  }

  main { max-width: 860px; margin: 0 auto; padding: 1.5rem 1rem 3rem; }

  .section {
    border: 1px solid var(--line); border-radius: var(--radius);
    padding: 1.4rem; margin-bottom: 1rem; background: var(--paper);
    box-shadow: var(--shadow);
  }
  .section h2 { font-size: 1.1rem; font-weight: 700; margin-bottom: .5rem; letter-spacing: -0.3px; }

  .example-bar { display: flex; flex-wrap: wrap; gap: .3rem; margin-bottom: .6rem; }
  .chip {
    font-size: .72rem; padding: .2em .55em; border-radius: var(--radius);
    border: 1px solid var(--line); background: var(--paper); cursor: pointer;
    transition: .1s; font-weight: 500; white-space: nowrap;
  }
  .chip:hover { border-color: var(--ink); background: var(--faint); }
  .chip.active { background: var(--ink); color: var(--paper); border-color: var(--ink); }

  .input-grid { display: grid; grid-template-columns: 1fr 1fr; gap: .7rem; }
  @media(max-width:600px){ .input-grid { grid-template-columns: 1fr; } }

  label {
    display: block; font-size: .68rem; font-weight: 600; text-transform: uppercase;
    letter-spacing: 1.2px; color: var(--muted); margin-bottom: .2rem;
  }
  input, textarea, select {
    width: 100%; padding: .5em .65em; border: 1px solid var(--line);
    border-radius: var(--radius); font-size: .88rem; font-family: var(--mono);
    background: var(--paper); color: var(--ink); transition: border-color .12s;
  }
  input:focus, textarea:focus, select:focus {
    outline: none; border-color: var(--ink); box-shadow: 0 0 0 2px rgba(0,0,0,.06);
  }
  textarea { resize: vertical; min-height: 50px; }

  .btn {
    display: inline-flex; align-items: center; gap: .3em; padding: .5em 1.2em;
    font-size: .85rem; font-weight: 600; font-family: 'Inter',sans-serif;
    border: 1px solid var(--ink); border-radius: var(--radius); cursor: pointer;
    background: var(--ink); color: var(--paper); transition: .1s;
    text-transform: uppercase; letter-spacing: 0.5px;
  }
  .btn:hover { background: var(--slate); border-color: var(--slate); }
  .btn-outline { background: var(--paper); color: var(--ink); }
  .btn-outline:hover { background: var(--faint); }
  .btn-row { display: flex; gap: .5rem; align-items: center; flex-wrap: wrap; margin-top: .7rem; }

  #results { display: none; }
  #results.visible { display: block; }

  .gate-card {
    border: 1px solid var(--line); border-radius: var(--radius);
    padding: 1rem; margin-bottom: .6rem; background: var(--paper);
    opacity: 0; transform: translateY(6px); transition: .25s;
  }
  .gate-card.show { opacity: 1; transform: translateY(0); }
  .gate-card .gate-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: .4rem; }
  .gate-name { font-weight: 700; font-size: .98rem; }
  .verdict {
    display: inline-block; padding: .1em .55em; border-radius: var(--radius);
    font-size: .7rem; font-weight: 700; text-transform: uppercase; letter-spacing: 1px;
  }
  .verdict.pass { border: 1px solid var(--ink); color: var(--ink); }
  .verdict.warn { border: 1px solid var(--muted); color: var(--muted); }
  .verdict.fail { border: 1px solid var(--line); color: var(--line); text-decoration: line-through; }

  .gate-detail { font-size: .85rem; color: var(--slate); line-height: 1.5; }

  .align-bar { background: var(--line); height: 6px; border-radius: var(--radius); margin: .3rem 0; overflow: hidden; }
  .align-fill { height: 100%; border-radius: var(--radius); background: var(--ink); transition: width .4s ease; }

  .tiers { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: .4rem; margin-top: .3rem; }
  @media(max-width:500px){ .tiers { grid-template-columns: 1fr; } }
  .tier-badge {
    text-align: center; padding: .3rem; border-radius: var(--radius);
    font-size: .78rem; font-weight: 600; border: 1px solid var(--line);
  }

  .overall {
    margin-top: .8rem; padding: .8rem 1rem; border-radius: var(--radius);
    font-weight: 700; font-size: 1rem; display: flex; align-items: center; gap: .4rem;
    border: 2px solid var(--ink);
  }
  .overall.ov-pass { background: var(--paper); color: var(--ink); }
  .overall.ov-attn { border-style: dashed; color: var(--slate); }

  .cert { font-size: .75rem; color: var(--muted); margin-top: .2rem; font-family: var(--mono); }

  footer {
    text-align: center; padding: .8rem; font-size: .72rem; color: var(--muted);
    border-top: 1px solid var(--line); font-weight: 400;
  }
  footer a { color: var(--ink); font-weight: 600; text-decoration: none; }
  footer a:hover { text-decoration: underline; }
</style>
</head>
<body>

<header>
  <h1>Leibniz</h1>
  <p>A <span class="accent">Universal Calculator for Truth</span> — interactive three‑gate proof verification running in your browser.</p>
  <span class="label">No install · No server · 18 examples</span>
</header>

<main>

  <section class="section">
    <h2>Theorem &amp; Proof</h2>
    <div class="example-bar" id="example-bar"></div>

    <div class="input-grid">
      <div><label for="name">Name</label><input id="name" placeholder="add_comm_vec"></div>
      <div><label for="domain">Domain</label>
        <select id="domain">
          <option value="linear_algebra">linear algebra</option>
          <option value="arithmetic">arithmetic</option>
          <option value="algebra">algebra</option>
          <option value="number_theory">number theory</option>
          <option value="set_theory">set theory</option>
          <option value="general">general</option>
        </select>
      </div>
    </div>

    <label for="stmt">Lean 4 statement</label>
    <textarea id="stmt" rows="2" placeholder="theorem add_comm_vec (v w : Fin n → ℝ) : v + w = w + v"></textarea>

    <label for="proof">Proof</label>
    <textarea id="proof" rows="3" placeholder="by ext i; exact add_comm (v i) (w i)"></textarea>

    <div class="btn-row">
      <button class="btn" onclick="runReview()" id="run-btn">Run 3‑Gate Review</button>
      <button class="btn btn-outline" onclick="clearForm()">Clear</button>
    </div>
  </section>

  <div id="results">
    <section class="section"><h2>Results</h2><div id="gates"></div></section>
  </div>

</main>

<footer>
  Two Mathematicians · <a href="https://github.com/twomathematicians-code/leibniz">GitHub</a> · MIT License
</footer>

<script>
const ENCYCLOPEDIA = [
  {name:"two_plus_two",informal:"2+2=4",stmt:"theorem two_plus_two : 2 + 2 = 4",proof:"by rfl",domain:"arithmetic",difficulty:"easy",kw:["addition","arithmetic","numbers"]},
  {name:"three_times_three",informal:"3×3=9",stmt:"theorem three_times_three : 3 * 3 = 9",proof:"by rfl",domain:"arithmetic",difficulty:"easy",kw:["multiplication","arithmetic","numbers"]},
  {name:"ten_minus_four",informal:"10−4=6",stmt:"theorem ten_minus_four : 10 - 4 = 6",proof:"by rfl",domain:"arithmetic",difficulty:"easy",kw:["subtraction","arithmetic"]},
  {name:"add_zero_left",informal:"n+0=n",stmt:"theorem add_zero_left (n : Nat) : n + 0 = n",proof:"by rfl",domain:"algebra",difficulty:"easy",kw:["addition","identity","algebra"]},
  {name:"add_comm_nat",informal:"a+b=b+a",stmt:"theorem add_comm_nat (a b : Nat) : a + b = b + a",proof:"by rw [Nat.add_comm]",domain:"algebra",difficulty:"medium",kw:["addition","commutativity","algebra"]},
  {name:"mul_one_right",informal:"n·1=n",stmt:"theorem mul_one_right (n : Nat) : n * 1 = n",proof:"by rfl",domain:"algebra",difficulty:"medium",kw:["multiplication","identity","algebra"]},
  {name:"even_square_is_even",informal:"(2n)²=4n²",stmt:"theorem even_square_is_even (n : Nat) : (2 * n) ^ 2 = 4 * (n ^ 2)",proof:"by rw [mul_pow, mul_assoc]; ring",domain:"number_theory",difficulty:"medium",kw:["parity","divisibility","squares"]},
  {name:"set_union_self",informal:"s∪s=s",stmt:"theorem set_union_self (α : Type) (s : Set α) : s ∪ s = s",proof:"by ext x; simp [Set.or_self]",domain:"set_theory",difficulty:"easy",kw:["sets","union","idempotence"]},
  {name:"zero_lt_one",informal:"0<1",stmt:"theorem zero_lt_one : 0 < (1 : Nat)",proof:"by decide",domain:"order",difficulty:"easy",kw:["order","positivity"]},
  {name:"infinitude_of_primes",informal:"Infinite primes.",stmt:"theorem infinitude_of_primes : ∀ n, ∃ p, p > n ∧ Nat.Prime p",proof:"",domain:"number_theory",difficulty:"hard",kw:["primes","infinitude","euclid"]},
  {name:"add_comm_vec",informal:"v+w=w+v",stmt:"theorem add_comm_vec (v w : Fin n → ℝ) : v + w = w + v",proof:"by ext i; exact add_comm (v i) (w i)",domain:"linear_algebra",difficulty:"easy",kw:["vector","addition","commutativity"]},
  {name:"smul_add_vec",informal:"c·(v+w)=c·v+c·w",stmt:"theorem smul_add_vec (c : ℝ) (v w : Fin n → ℝ) : c • (v + w) = c • v + c • w",proof:"by ext i; exact mul_add c (v i) (w i)",domain:"linear_algebra",difficulty:"medium",kw:["scalar","distributivity","vector space"]},
  {name:"one_smul_vec",informal:"1·v=v",stmt:"theorem one_smul_vec (v : Fin n → ℝ) : (1 : ℝ) • v = v",proof:"by ext i; simp",domain:"linear_algebra",difficulty:"easy",kw:["identity","unity","scalar"]},
  {name:"eigenvalue_id",informal:"id has eigenvalue 1 on nonzero vectors",stmt:"theorem eigenvalue_id (v : Fin n → ℝ) (hv : v ≠ 0) : (λ x : Fin n → ℝ => x) v = (1 : ℝ) • v",proof:"by simp",domain:"linear_algebra",difficulty:"medium",kw:["eigenvalue","identity","spectral"]},
  {name:"add_neg_vec",informal:"v+(-v)=0",stmt:"theorem add_neg_vec (v : Fin n → ℝ) : v + (-v) = 0",proof:"by ext i; simp",domain:"linear_algebra",difficulty:"easy",kw:["negation","additive inverse"]},
  {name:"smul_assoc_vec",informal:"c·(d·v)=(c·d)·v",stmt:"theorem smul_assoc_vec (c d : ℝ) (v : Fin n → ℝ) : c • (d • v) = (c * d) • v",proof:"by ext i; simp [mul_assoc]",domain:"linear_algebra",difficulty:"medium",kw:["scalar","associativity","field"]},
  {name:"determinant_2x2",informal:"det[[a,b],[c,d]]=ad−bc",stmt:"-- Hard: needs matrix representation in Lean",proof:"",domain:"linear_algebra",difficulty:"hard",kw:["determinant","matrix","invertibility"]},
  {name:"linear_combination_zero",informal:"a·v+b·w=0, a,b≠0 ⇒ v,w dependent",stmt:"theorem linear_combination_zero (a b : ℝ) (ha : a ≠ 0) (hb : b ≠ 0) (v w : Fin 2 → ℝ) (h : a • v + b • w = 0) : ∃ c : ℝ, w = c • v",proof:"",domain:"linear_algebra",difficulty:"hard",kw:["linear dependence","linear combination"]},
];

function tok(s) { return [...(s||'').toLowerCase().matchAll(/[a-zA-Z_][a-zA-Z0-9_]*/g)].map(m=>m[0]); }

function gate1(stmt, proof) {
  if (!stmt.trim()) return {passed:null, cert:"No statement.", error:"Empty.", comments:["No formal statement."]};
  if (!proof.trim()) return {passed:null, cert:"No proof.", error:"Empty.", comments:["No proof."]};

  const entry = ENCYCLOPEDIA.find(e => e.stmt.trim() === stmt.trim());
  if (entry && entry.proof.trim() === proof.trim()) {
    if (proof.includes("sorry")) return {passed:false, cert:"REJECTED · sorry", error:"`sorry` is an unproven goal.", comments:["❌ `sorry` — incomplete."], formal:false};
    return {passed:true, cert:"PROVISIONAL · encyclopedia match", error:null, comments:["Proof matches certified entry · structurally sound.","Install elan + Lean 4 for a formal certificate."], formal:false};
  }
  if (proof.trim()==="by sorry"||proof.includes("sorry")) return {passed:false, cert:"REJECTED · sorry", error:"`sorry` — incomplete.", comments:["❌ `sorry` — proof is not complete."], formal:false};
  if (/^by\s/.test(proof.trim())) return {passed:null, cert:"HEURISTIC · surface check only", error:null, comments:["Surface syntax plausible · cannot formally verify without Lean 4."], formal:false};
  return {passed:null, cert:"UNKNOWN", error:"Format not recognized.", comments:["Proof format not recognized."], formal:false};
}

function gate2(name, stmt, proof, domain) {
  const entry = ENCYCLOPEDIA.find(e => e.name===name.trim()) || {kw:[],domain:domain||"general"};
  const exp = [...new Set([...entry.kw, ...(entry.domain||domain||"").replace(/_/g,' ').split(' ').filter(Boolean)])].map(w=>w.toLowerCase());
  const hay = new Set([...tok(stmt),...tok(proof),...tok(name),...tok(domain||'')]);
  const match = exp.filter(c => hay.has(c)||[...hay].some(h=>c.length>=4&&h.length>=4&&c.slice(0,4)===h.slice(0,4)));
  const miss = exp.filter(c=>!match.includes(c));
  let sc = exp.length ? Math.round(match.length/exp.length*100)/100 : 0.5;
  let rat = `Concept overlap: ${match.length}/${exp.length}.`;
  if (entry && entry.proof.trim()===proof.trim()) { sc = Math.min(1,sc+0.5); rat += " Boosted · proof matches encyclopedia."; }
  return {score:Math.round(sc*100)/100, matched:match, missing:miss, rationale:rat};
}

function gate3(proof) {
  const tac = (proof||'').trim();
  const tiers = [];
  if (!tac) tiers.push({tier:"easy",verdict:"fail",comments:["No proof supplied."]});
  else if (tac==="by sorry"||tac.includes("sorry")) tiers.push({tier:"easy",verdict:"fail",comments:["Uses `sorry` — unproven goal."]});
  else if (/^by\s/.test(tac)) tiers.push({tier:"easy",verdict:"pass",comments:["Well‑formed tactic block."]});
  else tiers.push({tier:"easy",verdict:"warn",comments:["Proof term present · verify type."]});

  const ent = ENCYCLOPEDIA.find(e=>e.proof.trim()===tac);
  if (ent) tiers.push({tier:"medium",verdict:"pass",comments:["Matches known‑good proof · logic flow sound."]});
  else if (tac.includes("rw [")||tac.includes("simp")||tac.includes("induction")||tac.includes("ring")) tiers.push({tier:"medium",verdict:"pass",comments:["Recognised tactic · intermediate goals likely resolve."]});
  else if (!tac) tiers.push({tier:"medium",verdict:"fail",comments:["No proof to evaluate."]});
  else tiers.push({tier:"medium",verdict:"warn",comments:["Cannot confirm each pre‑condition · review intermediate goals."]});

  if (ent) tiers.push({tier:"hard",verdict:"pass",comments:["Certified encyclopedia proof · minimal, faithful, edge‑case‑aware."]});
  else if (!tac) tiers.push({tier:"hard",verdict:"fail",comments:["No proof at deepest tier."]});
  else tiers.push({tier:"hard",verdict:"warn",comments:["Plausible but not independently verified · recommend formal Lean check."]});

  const ov = tiers.some(t=>t.verdict==="fail") ? "fail" : tiers.some(t=>t.verdict==="warn") ? "warn" : "pass";
  return {tiers, overall_verdict:ov};
}

function verdictHTML(v) { return `<span class="verdict ${v}">${v}</span>`; }

function render(g1,g2,g3) {
  const c = document.getElementById('gates');
  const overallPass = (g1.passed===true||g1.passed===null) && g2.score>=0.5 && g3.overall_verdict!=="fail";
  const v1 = g1.passed===true?"pass":g1.passed===false?"fail":"warn";
  const v2 = g2.score>=0.5?"pass":g2.score>=0.3?"warn":"fail";

  let h = '';
  h += `<div class="gate-card"><div class="gate-header"><span class="gate-name">Gate 1 · Validity</span>${verdictHTML(v1)}</div><div class="gate-detail">${g1.comments.map(x=>`<div>${x}</div>`).join('')}<div class="cert">${g1.cert||''}</div></div></div>`;
  h += `<div class="gate-card"><div class="gate-header"><span class="gate-name">Gate 2 · Alignment</span>${verdictHTML(v2)}</div><div class="gate-detail"><div>Score: <strong>${g2.score.toFixed(2)}</strong> / 1.00</div><div class="align-bar"><div class="align-fill" style="width:${(g2.score*100).toFixed(0)}%"></div></div><div>Matched: <strong>${g2.matched.length?g2.matched.join(', '):'(none)'}</strong></div><div style="color:var(--muted)">Missing: ${g2.missing.length?g2.missing.join(', '):'(none)'}</div><div style="margin-top:.2rem;font-size:.8rem">${g2.rationale}</div></div></div>`;
  h += `<div class="gate-card"><div class="gate-header"><span class="gate-name">Gate 3 · Reading</span>${verdictHTML(g3.overall_verdict)}</div><div class="tiers">${g3.tiers.map(t=>`<div class="tier-badge"><div style="font-size:.65rem;text-transform:uppercase;letter-spacing:1px;color:var(--muted)">${t.tier}</div>${verdictHTML(t.verdict)}<div style="font-size:.72rem;margin-top:.15rem;line-height:1.3">${t.comments[0]||''}</div></div>`).join('')}</div></div>`;

  const ovCls = overallPass ? "ov-pass" : "ov-attn";
  const ovIcon = overallPass ? "◈" : "◇";
  const ovTxt = overallPass ? "PASSED — all three gates clear" : "ATTENTION — one or more gates flagged issues";
  h += `<div class="overall ${ovCls}"><span style="font-size:1.3rem">${ovIcon}</span> ${ovTxt}</div>`;

  c.innerHTML = h;
  document.getElementById('results').classList.add('visible');
  setTimeout(()=>{c.querySelectorAll('.gate-card').forEach(x=>x.classList.add('show'))},40);
  c.scrollIntoView({behavior:'smooth',block:'center'});
}

function runReview() {
  const stmt = document.getElementById('stmt').value.trim();
  const proof = document.getElementById('proof').value.trim();
  if (!stmt||!proof) { alert("Enter both a Lean statement and a proof."); return; }
  const g1 = gate1(stmt, proof);
  const g2 = gate2(document.getElementById('name').value, stmt, proof, document.getElementById('domain').value);
  const g3 = gate3(proof);
  render(g1,g2,g3);
}

function load(e) {
  document.getElementById('name').value = e.name;
  document.getElementById('stmt').value = e.stmt;
  document.getElementById('proof').value = e.proof;
  document.getElementById('domain').value = e.domain;
  document.querySelectorAll('.chip').forEach(c=>c.classList.remove('active'));
  document.querySelector(`.chip[data-name="${e.name}"]`)?.classList.add('active');
}

function clearForm() {
  ['name','stmt','proof'].forEach(id=>document.getElementById(id).value='');
  document.getElementById('domain').value='linear_algebra';
  document.getElementById('results').classList.remove('visible');
  document.getElementById('gates').innerHTML='';
  document.querySelectorAll('.chip').forEach(c=>c.classList.remove('active'));
}

(function init(){
  const bar = document.getElementById('example-bar');
  ENCYCLOPEDIA.forEach(e=>{
    const c = document.createElement('span');
    c.className='chip'; c.textContent=e.name.replace(/_/g,' ').replace(/\b\w/g,x=>x.toUpperCase());
    c.dataset.name=e.name; c.title=e.informal||'';
    c.addEventListener('click',()=>load(e));
    bar.appendChild(c);
  });
})();
</script>

</body>
</html>
