name: Tests & Build

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  schedule:
    - cron: '0 6 * * 1'  # Weekly Monday test

jobs:
  # ------------------------------------------------------------------
  # Python tests + lint (StubBackend — no GPU/Lean needed)
  # ------------------------------------------------------------------
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.11', '3.12']

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install deps
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pytest

    - name: Run tests
      run: PYTHONPATH=. python -m pytest tests -q --tb=short

    - name: Syntax-check all modules
      run: |
        python -m py_compile leibniz/config.py
        python -m py_compile leibniz/core/types.py
        python -m py_compile leibniz/core/difficulty.py
        python -m py_compile leibniz/llm/backend.py
        python -m py_compile leibniz/llm/prompts.py
        python -m py_compile leibniz/pipeline.py
        python -m py_compile leibniz/formal/lean_client.py
        python -m py_compile leibniz/formal/snippets.py
        python -m py_compile leibniz/stages/discover.py
        python -m py_compile leibniz/stages/prove.py
        python -m py_compile leibniz/stages/verify.py
        python -m py_compile leibniz/stages/align.py
        python -m py_compile leibniz/stages/read.py
        python -m py_compile leibniz/encyclopedia/lookup.py
        python -m py_compile api/main.py
        echo "All modules compile cleanly."

    - name: Demo smoke test
      run: PYTHONPATH=. python scripts/demo.py --seed "arithmetic" 2>&1 | head -20

    - name: Training harness smoke test
      run: PYTHONPATH=. python training/eval.py --stub --limit 10 --k 4 2>&1 | tail -5

  # ------------------------------------------------------------------
  # Docker build check
  # ------------------------------------------------------------------
  docker-build:
    runs-on: ubuntu-latest
    needs: test
    steps:
    - uses: actions/checkout@v4
    - name: Build Docker image
      run: docker build -t leibniz-engine -f api/Dockerfile .
    - name: Verify image
      run: docker images | grep leibniz-engine

  # ------------------------------------------------------------------
  # Lean 4 lake build (best-effort; skips silently if elan absent)
  # ------------------------------------------------------------------
  leibniz-lean:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
    - uses: actions/checkout@v4

    - name: Install elan
      uses: leanprover/elan-init@v2
      with:
        default-toolchain: leanprover/lean4:v4.14.0

    - name: Lake build
      working-directory: lean
      run: lake build
